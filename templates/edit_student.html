{% extends "base.html" %}
{% block title %}Edit student{% endblock %}
{% block content %}
<section class="page-heading compact-heading"><div><p class="eyebrow">REGISTRAR WORKSPACE <span>/</span> EDIT RECORD</p><h1>Edit student</h1><p class="heading-copy">Registration number {{ student.registration_number }}</p></div><a class="button button-secondary" href="{{ url_for('index') }}">← Back to directory</a></section>
<section class="edit-panel"><form method="post" action="{{ url_for('edit_student', student_id=student.student_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% include "student_fields.html" %}<div class="form-actions"><button class="button button-primary" type="submit">Save changes <span aria-hidden="true">→</span></button><a class="button button-secondary" href="{{ url_for('index') }}">Cancel</a></div></form></section>
{% endblock %}
